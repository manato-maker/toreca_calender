<style>

</div>

</div>
<button id="addBtn" class="fab">＋</button>
<dialog id="dlg"><div class="modal"><h2>抽選を追加</h2>
<div class="grid2"><label class="field">抽選日<input id="fdate" type="date"></label><label class="field">時刻<input id="ftime" type="time"></label></div>
<label class="field">タイトル<input id="ftitle"></label><label class="field">店舗<input id="fstore"></label><label class="field">メモ<input id="fnote"></label>
<div class="toolbar"><button id="saveBtn" class="active">追加</button><button id="cancelBtn">キャンセル</button></div></div></dialog>

$('#search').oninput=renderItems;$('#prev').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);selectedDate=null;render();};$('#next').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);selectedDate=null;render();};
const dlg=$('#dlg');$('#addBtn').onclick=()=>dlg.showModal();$('#cancelBtn').onclick=()=>dlg.close();$('#saveBtn').onclick=()=>{const date=$('#fdate').value,title=$('#ftitle').value.trim(),store=$('#fstore').value.trim();if(!date||!title||!store)return alert('抽選日・タイトル・店舗は必須です');custom.push({id:'custom-'+Date.now(),date,time:$('#ftime').value,title,store,status:'unreported',note:$('#fnote').value});localStorage.setItem(KEY_CUSTOM,JSON.stringify(custom));dlg.close();render();};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({custom,overrides},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='トレカ抽選バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#importFile').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());custom=o.custom||[];overrides=o.overrides||{};localStorage.setItem(KEY_CUSTOM,JSON.stringify(custom));localStorage.setItem(KEY_OVR,JSON.stringify(overrides));render();}catch{alert('バックアップを読み込めませんでした');}};
const LEDGER_KEY='tcg-ledger-v1';
let ledger=JSON.parse(localStorage.getItem(LEDGER_KEY)||'null')||[
 {id:'purchase-001',date:'2026-08-16',title:'メガシンフォニア',store:'カードボックスオーサカ',qty:1,buy:5400,condition:'未開封・シュリンクあり',state:'保有',sale:0,opened:false,note:'レシートなし'},
 {id:'purchase-002',date:'2026-08-19',title:'ストームエメラルダ 2P',store:'セブンイレブン 王寺畠田4丁目',qty:2,buy:200,condition:'未開封パック',state:'保有',sale:0,opened:false,note:'3P購入（計600円）・1P開封・2P残し'}
];
localStorage.setItem(LEDGER_KEY,JSON.stringify(ledger));
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function renderLedger(){
 const q=($('#ledgerSearch')?.value||'').trim().toLowerCase();
 const a=ledger.filter(x=>!q||(x.title+' '+x.store+' '+x.condition+' '+x.state).toLowerCase().includes(q));
 const cost=ledger.reduce((n,x)=>n+x.buy*x.qty,0), sales=ledger.reduce((n,x)=>n+(x.sale||0),0), held=ledger.filter(x=>x.state==='保有').length;
 $('#ledgerSummary').innerHTML=`<div class="stat">仕入総額<b>${yen(cost)}</b></div><div class="stat">売却総額<b>${yen(sales)}</b></div><div class="stat">保有<b>${held}件</b></div><div class="stat">確定損益<b>${yen(sales-cost)}</b></div>`;
 $('#ledgerItems').innerHTML=a.map(x=>`<div class="stock-item"><div class="stock-head"><div><div class="datepill">${fmtDate(x.date)}</div><div class="title">${esc(x.title)}</div><div class="meta">🏪 ${esc(x.store)}</div></div><div class="money">${yen(x.buy)}</div></div><div style="margin-top:8px"><span class="tag">${esc(x.condition)}</span><span class="tag">${esc(x.state)}</span>${x.opened?'<span class="tag">開封済</span>':'<span class="tag">未開封</span>'}</div><div class="note">数量 ${x.qty}｜仕入 ${yen(x.buy*x.qty)}${x.sale?'｜売却 '+yen(x.sale):''}${x.note?'｜'+esc(x.note):''}</div></div>`).join('')||'<div class="empty">該当する仕入れはありません</div>';
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const l=b.dataset.page==='lottery';$('#lotteryPage').classList.toggle('hidden',!l);$('#ledgerPage').classList.toggle('hidden',l);$('#addBtn').classList.toggle('hidden',!l);if(!l)renderLedger();});
$('#ledgerSearch').oninput=renderLedger;
renderLedger();
render();
</script></body></html>
